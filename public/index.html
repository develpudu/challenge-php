<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Productos</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Gestión de Productos</h1>
            <p class="subtitle">API REST con conversión ARS → USD</p>
        </header>

        <div id="message" class="message hidden"></div>

        <section class="form-section">
            <h2 id="form-title">Nuevo Producto</h2>
            <form id="product-form">
                <input type="hidden" id="product-id">
                <div class="form-group">
                    <label for="nombre">Nombre:</label>
                    <input type="text" id="nombre" required maxlength="255" placeholder="Nombre del producto">
                </div>
                <div class="form-group">
                    <label for="descripcion">Descripción:</label>
                    <textarea id="descripcion" required placeholder="Descripción del producto"></textarea>
                </div>
                <div class="form-group">
                    <label for="precio">Precio (ARS):</label>
                    <input type="number" id="precio" required min="0" step="0.01" pattern="[0-9]+(\.[0-9]+)?" placeholder="Números, usando punto para decimales (ej: 1234.56)">
                </div>
                <div class="form-actions">
                    <button type="submit" id="submit-btn">Guardar</button>
                    <button type="button" id="cancel-btn" class="hidden">Cancelar</button>
                </div>
            </form>
        </section>

        <section class="list-section">
            <h2>Productos</h2>
            <div id="loading" class="loading hidden">Cargando...</div>
            <table id="products-table" class="hidden">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Descripción</th>
                        <th>Precio (ARS)</th>
                        <th>Precio (USD)</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="products-body">
                </tbody>
            </table>
            <div id="empty-message" class="empty-message hidden">No hay productos registrados.</div>
        </section>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
